version: 2

updates:
  # Reads versions from Directory.Packages.props.
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      test-dependencies:
        patterns:
          - coverlet.*
          - Microsoft.NET.Test.Sdk
          - xunit*

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
