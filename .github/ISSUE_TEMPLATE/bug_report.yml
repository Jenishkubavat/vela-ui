name: Bug report
description: A component, the CLI, or a primitive doesn't behave as it should.
labels: [bug]
body:
  - type: input
    id: area
    attributes:
      label: Component or command
      description: For example `dialog`, `CheckboxPrimitive`, or `vela add`.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Vela UI version
      description: The output of `vela --version`, or the commit you're running from.
    validations:
      required: true
  - type: dropdown
    id: render-mode
    attributes:
      label: Render mode
      options:
        - Static server rendering
        - Interactive Server
        - Interactive WebAssembly
        - Interactive Auto
        - Not related to rendering (CLI, build)
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and OS
      description: For example "Firefox 140 on Windows 11". Include the .NET SDK version for CLI or build problems.
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The smallest Razor markup or commands that show the problem.
      render: razor
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened
      description: Include error messages, and for keyboard or screen reader problems, the keys you pressed and what was announced.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
